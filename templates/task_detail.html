<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ task.title }}</title>
</head>

<body>

    <h1>{{ task.title }}</h1>

    <p>
        <strong>Description:</strong>
        {{ task.description }}
    </p>

    <p>
        <strong>Status:</strong>

        {% if task.completed %}
            Completed
        {% else %}
            Not Completed
        {% endif %}
    </p>

    <p>
        <strong>Created date:</strong>
        {{ task.created_at }}
    </p>

    <a href="{% url 'todolist' %}">
        Back to Tasks
    </a>
    <br><br>
    <a href="{% url 'edit_task' task.id %}">
        Edit Task
    </a>



    <form method="POST"
      action="{% url 'delete_task' task.id %}">

    {% csrf_token %}
    <br>
    <button type="submit">
        Delete Task
    </button>

</body>
</html>
