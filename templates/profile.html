<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORIENT ACADEMY - Profile / info</title>


    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- FontAwesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <!-- Google Font: Open Sans -->
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">


    <style>

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f4f6f9;
        }


        /* Sidebar */

        #sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #343a40;
            transition: margin-left 0.3s ease-in-out;
            z-index: 1000;
        }

        #sidebar.collapsed {
            margin-left: -250px;
        }


        /* User section */

        .sidebar-user {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #2f353a;
        }


        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #e9ecef;
            color: #6c757d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            flex-shrink: 0;
        }


        .teacher-name {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;

            transition: color 0.2s ease;
        }

        .teacher-name:hover {
            color: #adb5bd;
        }


        /* Sidebar navigation */

        .sidebar-nav .nav-link {
            color: #c2c7d0;

            padding: 12px 16px;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.5px;

            display: flex;
            align-items: center;

            gap: 12px;

            transition: all 0.2s ease-in-out;

            text-transform: uppercase;
        }


        .sidebar-nav .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }


        .sidebar-nav .nav-link i {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }


        /* Top Navbar */

        .top-navbar {
            height: 50px;

            background-color: #ffffff;

            border-bottom: 1px solid #dee2e6;
        }


        /* Main layout */

        .main-wrapper {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-width: 0;
        }


        .content-body {
            background-color: #eef2f5;

            flex: 1;
        }


        /* Profile avatar */

        .profile-avatar-container {
            position: relative;

            width: 100%;
            max-width: 280px;

            margin: 0 auto;

            aspect-ratio: 4 / 5;

            background-color: #d8dbde;

            border-radius: 4px;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            overflow: hidden;
        }


        .profile-avatar-svg {
            width: 85%;
            height: 85%;

            fill: #ffffff;
        }


        .camera-upload-btn {
            position: absolute;

            bottom: 15px;
            right: 15px;

            background: transparent;

            border: none;

            color: #2b2b2b;

            font-size: 28px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                color 0.2s ease;
        }


        .camera-upload-btn:hover {
            transform: scale(1.1);
            color: #000000;
        }


        /* Form */

        .profile-form-grid {
            border: 1px solid #e1e6ea;

            border-radius: 4px;

            overflow: hidden;
        }


        .form-row-custom {
            display: flex;

            border-bottom: 1px solid #e1e6ea;

            background-color: #ffffff;
        }


        .form-row-custom:last-child {
            border-bottom: none;
        }


        .form-label-custom {
            width: 160px;

            padding: 12px 16px;

            font-weight: 700;

            font-size: 13px;

            color: #333333;

            display: flex;

            align-items: center;

            background-color: #ffffff;

            flex-shrink: 0;
        }


        .form-input-custom {
            flex: 1;

            padding: 8px 12px;

            display: flex;

            align-items: center;

            background-color: #ffffff;
        }


        .form-input-custom .form-control {
            border: 1px solid #dce1e7;

            border-radius: 3px;

            font-size: 13.5px;

            color: #495057;

            padding: 6px 12px;

            box-shadow: none;
        }


        .form-input-custom .form-control:focus {
            border-color: #80bdff;

            box-shadow: none;
        }


        .form-action-row {
            padding: 10px 16px;

            background-color: #ffffff;

            display: flex;

            justify-content: flex-end;

            border-top: 1px solid #e1e6ea;
        }


        .btn-custom-save {
            background-color: #28a745;

            border-color: #28a745;

            color: #ffffff;

            font-size: 13px;

            font-weight: 600;

            padding: 5px 14px;

            border-radius: 4px;

            display: inline-flex;

            align-items: center;

            gap: 6px;
        }


        .btn-custom-save:hover {
            background-color: #218838;

            border-color: #1e7e34;

            color: #ffffff;
        }


        /* Breadcrumb */

        .breadcrumb-item + .breadcrumb-item::before {
            content: "/";

            color: #6c757d;
        }


        /* Footer */

        .main-footer {
            background-color: #ffffff;

            border-top: 1px solid #dee2e6;

            padding: 0.8rem 1.5rem;

            font-size: 13px;

            color: #777777;

            font-weight: 700;
        }


        /* Responsive */

        @media (max-width: 576px) {

            .form-row-custom {
                display: block;
            }

            .form-label-custom {
                width: 100%;
                padding-bottom: 5px;
            }

            .form-input-custom {
                padding-top: 0;
            }

        }

    </style>

</head>


<body class="d-flex min-vh-100">


<!-- Sidebar -->

<aside
    id="sidebar"
    class="d-flex flex-column flex-shrink-0 text-white">


    <!-- User Profile -->

    <div class="sidebar-user">

        <div class="user-avatar">

            <i class="fa-solid fa-user"></i>

        </div>


        <a
            href="{% url 'profile' %}"
            class="teacher-name">

            {{ teacher.full_name }}

        </a>

    </div>


    <!-- Navigation -->

    <nav class="sidebar-nav mt-2">


        <a
            href="{% url 'homepage' %}"
            class="nav-link">

            <i class="fa-solid fa-house"></i>

            <span>ƏSAS SƏHİFƏ</span>

        </a>


        <a
            href="#"
            class="nav-link">

            <i class="fa-solid fa-users"></i>

            <span>QRUPLAR</span>

        </a>


        <a
            href="#"
            class="nav-link">

            <i class="fa-solid fa-building-columns"></i>

            <span>HESABATLAR</span>

        </a>


    </nav>

</aside>


<!-- Main Wrapper -->

<div class="main-wrapper">


    <!-- Top Navbar -->

    <header
        class="top-navbar d-flex align-items-center justify-content-between px-3">


        <button
            id="menu-toggle"
            class="btn btn-link text-secondary p-0 text-decoration-none shadow-none"
            aria-label="Toggle Sidebar">

            <i class="fa-solid fa-bars fs-5"></i>

        </button>


        <div>

            <a
                href="{% url 'orientlogin' %}"
                class="text-secondary text-decoration-none"
                style="font-size: 13px;">

                Çıxış

            </a>

        </div>


    </header>


    <!-- Main Content -->

    <main class="content-body p-4">


        <!-- Page title -->

        <div
            class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4">


            <h2
                class="h3 fw-normal text-dark mb-2 mb-sm-0"
                style="font-size: 24px;">

                Profile / info

            </h2>


            <nav aria-label="breadcrumb">

                <ol
                    class="breadcrumb mb-0"
                    style="font-size: 13px;">


                    <li class="breadcrumb-item">

                        <a
                            href="{% url 'homepage' %}"
                            class="text-primary text-decoration-none">

                            Admin

                        </a>

                    </li>


                    <li
                        class="breadcrumb-item active text-secondary"
                        aria-current="page">

                        Profile / info

                    </li>


                </ol>

            </nav>

        </div>


        <!-- Profile -->

        <div class="row g-4">


            <!-- Left Column -->

            <div class="col-12 col-md-4 col-lg-3">


                <div
                    class="card border-0 shadow-sm rounded-1 h-100 p-3">


                    <div
                        class="card-body p-0 d-flex align-items-center justify-content-center">


                        <div class="profile-avatar-container">


                            <!-- User silhouette -->

                            <svg
                                class="profile-avatar-svg"
                                viewBox="0 0 100 100"
                                xmlns="http://www.w3.org/2000/svg">


                                <circle
                                    cx="50"
                                    cy="38"
                                    r="24" />


                                <path
                                    d="M 12,100 C 12,68 30,62 50,62 C 70,62 88,68 88,100 Z" />


                            </svg>


                            <!-- Camera -->

                            <button
                                class="camera-upload-btn"
                                title="Şəkli dəyiş"
                                type="button">

                                <i class="fa-solid fa-camera"></i>

                            </button>


                        </div>

                    </div>

                </div>

            </div>


            <!-- Right Column -->

            <div class="col-12 col-md-8 col-lg-9">


                <div
                    class="card border-0 shadow-sm rounded-1 p-4">


                    <div class="card-body p-0">


                        <h4
                            class="fw-bold text-dark mb-4"
                            style="font-size: 18px;">

                            Personal info

                        </h4>


                        <!-- Personal Information -->

                        <form
                            id="profile-form"
                            method="POST">

                            {% csrf_token %}


                            <div
                                class="profile-form-grid mb-4">


                                <!-- Full Name -->

                                <div class="form-row-custom">


                                    <div class="form-label-custom">

                                        Full Name

                                    </div>


                                    <div class="form-input-custom">


                                        <input
                                            type="text"
                                            class="form-control"
                                            name="full_name"
                                            value="{{ teacher.full_name }}"
                                            required>


                                    </div>

                                </div>


                                <!-- Email -->

                                <div class="form-row-custom">


                                    <div class="form-label-custom">

                                        Email

                                    </div>


                                    <div class="form-input-custom">


                                        <input
                                            type="email"
                                            class="form-control"
                                            name="email"
                                            value="{{ teacher.email }}"
                                            required>


                                    </div>

                                </div>


                                <!-- Save -->

                                <div class="form-action-row">


                                    <button
                                        type="submit"
                                        class="btn btn-custom-save">

                                        <i class="fa-solid fa-floppy-disk"></i>

                                        Save

                                    </button>


                                </div>


                            </div>


                            <!-- Password -->

                            <div class="profile-form-grid">


                                <div class="form-row-custom">


                                    <div class="form-label-custom">

                                        Password

                                    </div>


                                    <div class="form-input-custom">


                                        <input
                                            type="password"
                                            class="form-control"
                                            name="password"
                                            placeholder="Yeni parol">


                                    </div>

                                </div>


                                <!-- Re-Password -->

                                <div class="form-row-custom">


                                    <div class="form-label-custom">

                                        Re-Password

                                    </div>


                                    <div class="form-input-custom">


                                        <input
                                            type="password"
                                            class="form-control"
                                            name="re_password"
                                            placeholder="Yeni parolu təkrar yazın">


                                    </div>

                                </div>


                                <!-- Save -->

                                <div class="form-action-row">


                                    <button
                                        type="submit"
                                        class="btn btn-custom-save">

                                        <i class="fa-solid fa-floppy-disk"></i>

                                        Save

                                    </button>


                                </div>

                            </div>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer class="main-footer">

        Copyright © {% now 'Y-m-d' %} Orient Academy.

    </footer>


</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Sidebar Toggle -->

<script>

    document
        .getElementById('menu-toggle')
        .addEventListener('click', function () {

            document
                .getElementById('sidebar')
                .classList
                .toggle('collapsed');

        });

</script>


</body>

</html>
