<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | ORIENT ACADEMY</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 20px;
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #eaf0f8, #dce9e5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-container {
            width: 100%;
            max-width: 950px;
            min-height: 560px;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(22, 39, 64, 0.15);
        }

        /* Sol tərəf */

        .contact-info {
            position: relative;
            padding: 80px 40px 45px;
            background: linear-gradient(145deg, #142b49, #203d5e);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .back-button {
            position: absolute;
            top: 25px;
            left: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.25s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.13);
            border-color: #65d6a0;
            color: #65d6a0;
            transform: translateX(-3px);
        }

        .brand {
            display: inline-block;
            margin-bottom: 35px;
            color: #65d6a0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .contact-info h2 {
            margin: 0 0 18px;
            font-size: 36px;
            line-height: 1.3;
        }

        .contact-info h2 span {
            color: #65d6a0;
        }

        .contact-info p {
            margin: 0;
            color: #d0dbea;
            font-size: 14px;
            line-height: 1.9;
        }

        .info-bottom {
            margin-top: 45px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            color: #d0dbea;
            font-size: 13px;
            line-height: 1.8;
        }

        /* Sağ tərəf - forma */

        .contact-form {
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-form h1 {
            margin: 0 0 8px;
            color: #192b43;
            font-size: 30px;
            font-weight: 700;
        }

        .form-description {
            margin: 0 0 30px;
            color: #7b8796;
            font-size: 13px;
            line-height: 1.7;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #29394e;
            font-size: 13px;
            font-weight: 600;
        }

        input,
        textarea {
            display: block;
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dce3eb;
            border-radius: 9px;
            background: #f8fafc;
            color: #26364a;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
        }

        input {
            height: 49px;
        }

        textarea {
            min-height: 125px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #31a878;
            background: white;
            box-shadow: 0 0 0 3px rgba(49, 168, 120, 0.12);
        }

        input::placeholder,
        textarea::placeholder {
            color: #a1acba;
        }

        .button-container {
            margin-top: 8px;
        }

        .send-button {
            width: 100%;
            min-height: 51px;
            border: none;
            border-radius: 9px;
            background: #2ba875;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .send-button:hover {
            background: #218b60;
            transform: translateY(-2px);
        }

        /* Mobil görünüş */

        @media (max-width: 700px) {
            body {
                padding: 20px 12px;
            }

            .contact-container {
                max-width: 500px;
                grid-template-columns: 1fr;
            }

            .contact-info {
                padding: 90px 28px 32px;
            }

            .back-button {
                top: 22px;
                left: 25px;
            }

            .brand {
                margin-bottom: 25px;
            }

            .contact-info h2 {
                font-size: 29px;
            }

            .info-bottom {
                margin-top: 25px;
            }

            .contact-form {
                padding: 35px 25px;
            }

            .contact-form h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="contact-container">

    <!-- Sol məlumat hissəsi -->

    <div class="contact-info">

        <a href="{% url 'homepage' %}" class="back-button">
            <span>&larr;</span>
            Geri qayıt
        </a>

        <div class="brand">ORIENT ACADEMY</div>

        <h2>
            Let's start a<br>
            <span>conversation.</span>
        </h2>

        <p>
            Suallarınız və təklifləriniz var?
            Bizə mesaj göndərin. Sizə kömək etməkdən
            məmnun olarıq.
        </p>

        <div class="info-bottom">
            Sizin fikirləriniz bizim üçün dəyərlidir.
        </div>

    </div>

    <!-- Əlaqə forması -->

    <div class="contact-form">

        <h1>Contact us</h1>

        <p class="form-description">
            Aşağıdakı formanı doldurun və bizə mesaj göndərin.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Adınızı daxil edin"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Mesajınızı buraya yazın..."
                    required
                ></textarea>
            </div>

            <div class="button-container">
                <button type="submit" class="send-button">
                    SEND MESSAGE &rarr;
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
