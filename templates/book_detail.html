<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>{{ book.title }}</title>
</head>

<body class="bg-light">

<div class="container py-5">

    <a href="{% url 'books' %}"
       class="btn btn-outline-secondary mb-4">
        ← Kitablar
    </a>

    <div class="row g-4">

        <!-- Kitab məlumatları -->

        <div class="col-lg-8">

            <div class="card shadow-sm h-100">

                <div class="card-body p-4">

                    <h1 class="fw-bold mb-3">
                        {{ book.title }}
                    </h1>

                    <div class="mb-4">

                        <span class="badge text-bg-success fs-6">
                            {{ book.price }} ₼
                        </span>

                        <span class="badge text-bg-secondary fs-6">
                            {{ book.published_date }}
                        </span>

                    </div>

                    <h5>Açıqlama</h5>

                    <p class="text-muted">
                        {{ book.description }}
                    </p>

                </div>

            </div>

        </div>


        <!-- Müəllif məlumatları -->

        <div class="col-lg-4">

            <div class="card shadow-sm h-100">

                <div class="card-body p-4">

                    <h4 class="fw-bold">
                        Müəllif
                    </h4>

                    <hr>

                    <h5>
                        {{ book.author.name }}
                        {{ book.author.surname }}
                    </h5>

                    <p class="text-muted">
                        Doğum tarixi:
                        {{ book.author.birth_date }}
                    </p>

                    <h6>Bioqrafiya</h6>

                    <p class="text-muted">
                        {{ book.author.bio }}
                    </p>

                    <a href="{% url 'author_detail' book.author.id %}"
                       class="btn btn-primary">
                        Müəllifə bax
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
