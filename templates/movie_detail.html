<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>{{ movie.title }}</title>
</head>

<body>

<div class="container py-5">

    <div class="row">

        <div class="col-md-5">

            {% if movie.image %}

                <img
                    src="{{ movie.image.url }}"
                    class="img-fluid rounded shadow"
                >

            {% endif %}

        </div>


        <div class="col-md-7">

            <h1>{{ movie.title }}</h1>

            <p class="text-muted">
                {{ movie.year }} • {{ movie.genre }}
            </p>

            <h4>⭐ {{ movie.rating }}</h4>

            <p class="mt-4">
                {{ movie.description }}
            </p>


            <a
                href="{% url 'edit_movie' movie.id %}"
                class="btn btn-warning"
            >
                Edit
            </a>


            <a
                href="{% url 'delete_movie' movie.id %}"
                class="btn btn-danger"
            >
                Delete
            </a>


            <a
                href="{% url 'movie_list' %}"
                class="btn btn-secondary"
            >
                ← Back
            </a>

        </div>

    </div>

</div>

</body>
</html>
