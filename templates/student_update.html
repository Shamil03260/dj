<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>

    <div class="container">

        <center><h3>Update Students</h3></center>

       <form method="post">
        {% csrf_token %}

        <label for="">Name</label>
        <input type="text" class="form-control" placeholder="Name" name="name" value="{{ students.name }}">
        <br>

        <label for="">Email</label>
        <input type="text" class="form-control" placeholder="Email" name="email" value="{{ students.email }}">
        <br>

        <label for="">Price</label>
        <input type="text" class="form-control" placeholder="Price" name="price" value="{{ students.price }}">
        <br>

        <label for="">Age</label>
        <input type="text" class="form-control" placeholder="Age" name="age" required value="{{ students.age }}">
        <br>
        <button type="submit" class="btn btn-primary btn-sm">Enter</button>
        



    </form>




    </div>
    
</body>
</html>
