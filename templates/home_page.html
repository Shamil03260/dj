<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORIENT ACADEMY - Əsas Səhifə</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f4f6f9;
        }

        /* Sidebar */
        #sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #343a40;
            transition: margin-left 0.3s ease-in-out;
            z-index: 1000;
        }

        #sidebar.collapsed {
            margin-left: -250px;
        }

        /* Sidebar Brand */
        .sidebar-brand {
            background-color: #2e3439;
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #6c757d;
            border: 1px solid #adb5bd;
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 900;
            font-size: 14px;
        }

        /* Teacher */
        .sidebar-user {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            display: flex;
            align-items: center;

            gap: 12px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            background-color: #e9ecef;
            color: #6c757d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            flex-shrink: 0;
        }

        .teacher-button {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            border: none;
            background: transparent;

            padding: 0;

            cursor: pointer;

            transition: color 0.2s ease;
        }

        .teacher-button:hover {
            color: #adb5bd;
        }

        /* Navigation */
        .sidebar-nav .nav-link {
            color: #c2c7d0;

            padding: 12px 16px;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.5px;

            display: flex;
            align-items: center;

            gap: 12px;

            transition: all 0.2s ease-in-out;

            text-transform: uppercase;
        }

        .sidebar-nav .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }

        .sidebar-nav .nav-link i {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }

        /* Top Navbar */
        .top-navbar {
            height: 56px;

            background-color: #ffffff;

            border-bottom: 1px solid #dee2e6;
        }

        /* Main Wrapper */
        .main-wrapper {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-width: 0;
        }

        /* Content */
        .content-body {
            background-color: #f4f6f9;

            flex: 1;
        }

        /* Breadcrumb */
        .breadcrumb-item + .breadcrumb-item::before {
            content: "/";
            color: #6c757d;
        }

        /* Footer */
        .main-footer {
            background-color: #ffffff;

            border-top: 1px solid #dee2e6;

            padding: 1rem 1.5rem;

            font-size: 13px;

            color: #6c757d;

            font-weight: 600;
        }

        /* Welcome Card */
        .welcome-card {
            border: none;
            border-radius: 10px;
        }

        .sidebar a {
            text-decoration: none;
            color: white;
            }

        .sidebar a:hover {
            text-decoration: none;
            color: white;
            }

    </style>

</head>


<body class="d-flex min-vh-100">


<!-- ================= SIDEBAR ================= -->

<aside
    id="sidebar"
    class="d-flex flex-column flex-shrink-0 text-white">


    <!-- Brand -->

    <div class="sidebar-brand">

        <div class="brand-logo-icon me-2">
            A
        </div>

        <span
            class="fw-bold text-light text-uppercase"
            style="font-size: 14px;">

            ORIENT ACADEMY

        </span>

    </div>


    <!-- Teacher Button -->

    <div class="sidebar-user">

        <div class="user-avatar">

            <i class="fa-solid fa-user"></i>

        </div>


        <!-- <button
            type="button"
            class="teacher-button">

            {{ teacher.full_name }}

        </button> -->

        <a href="{% url 'profile' %}" class="teacher-button">{{teacher.full_name}}</a>
        

    </div>

    
    <!-- Navigation -->

    <nav class="sidebar-nav mt-2">


        <a
            href="#"
            class="nav-link">

            <i class="fa-solid fa-users"></i>

            <span>
                QRUPLAR
            </span>

        </a>


        <a
            href="#"
            class="nav-link">

            <i class="fa-solid fa-building-columns"></i>

            <span>
                HESABATLAR
            </span>

        </a>


    </nav>

</aside>



<!-- ================= MAIN CONTENT ================= -->

<div class="main-wrapper">


    <!-- Top Navbar -->

    <header
        class="top-navbar d-flex align-items-center justify-content-between px-3">


        <!-- Menu Button -->

        <button
            id="menu-toggle"
            class="btn btn-link text-secondary p-0 text-decoration-none shadow-none">

            <i class="fa-solid fa-bars fs-5"></i>

        </button>


        <!-- Logout -->

        <div>

            <a
                href="{% url 'orientlogin' %}"
                class="text-secondary text-decoration-none"
                style="font-size: 14px;">

                Çıxış

            </a>

        </div>

    </header>



    <!-- ================= CONTENT ================= -->

    <main class="content-body p-4">


        <!-- Header -->

        <div
            class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4">


            <h2 class="h3 fw-normal text-dark mb-2 mb-sm-0">

                Əsas Səhifə

            </h2>


            <nav aria-label="breadcrumb">

                <ol
                    class="breadcrumb mb-0"
                    style="font-size: 13px;">


                    <li class="breadcrumb-item">

                        <a
                            href="{% url 'homepage' %}"
                            class="text-primary text-decoration-none">

                            Admin

                        </a>

                    </li>


                    <li
                        class="breadcrumb-item active text-secondary"
                        aria-current="page">

                        Əsas Səhifə

                    </li>

                </ol>

            </nav>

        </div>



        <!-- Welcome Card -->

        <div class="container-fluid p-0">


            <div class="card welcome-card shadow-sm">


                <div class="card-body p-4">


                    <h4 class="mb-2">

                        Xoş gəlmisən,
                        {{ teacher.full_name }}!

                    </h4>


                    <p class="text-secondary mb-0">

                        ORIENT ACADEMY idarəetmə panelinə
                        xoş gəlmisiniz.

                    </p>


                </div>

            </div>


        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="main-footer">

        Copyright © {% now 'Y-m-d' %} Orient Academy.

    </footer>


</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>



<!-- Sidebar Toggle -->

<script>

    document
        .getElementById('menu-toggle')
        .addEventListener('click', function () {

            document
                .getElementById('sidebar')
                .classList
                .toggle('collapsed');

        });

</script>


</body>

</html>
