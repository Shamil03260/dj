<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Movie Catalog</title>
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>🎬 Film Kataloqu</h1>

        <a href="{% url 'add_movie' %}" class="btn btn-primary">
            + Film əlavə et
        </a>
    </div>


    <!-- Search -->

    <form method="GET" class="row g-2 mb-4">

        <div class="col-md-4">
            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Film axtar..."
                value="{{ request.GET.search }}"
            >
        </div>


        <!-- Genre -->

        <div class="col-md-2">
            <select name="genre" class="form-select">

                <option value="">Janr</option>

                {% for genre in genres %}
                    <option value="{{ genre }}">
                        {{ genre }}
                    </option>
                {% endfor %}

            </select>
        </div>


        <!-- Year -->

        <div class="col-md-2">
            <select name="year" class="form-select">

                <option value="">İl</option>

                {% for year in years %}
                    <option value="{{ year }}">
                        {{ year }}
                    </option>
                {% endfor %}

            </select>
        </div>


        <!-- Rating -->

        <div class="col-md-2">

            <input
                type="number"
                step="0.1"
                min="0"
                max="10"
                name="rating"
                class="form-control"
                placeholder="Min rating"
            >

        </div>


        <div class="col-md-2">

            <button class="btn btn-dark w-100">
                Filter
            </button>

        </div>

    </form>


    <!-- Movies -->

    <div class="row">

        {% for movie in movies %}

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow-sm">

                {% if movie.image %}

                    <img
                        src="{{ movie.image.url }}"
                        class="card-img-top"
                        style="height: 350px; object-fit: cover;"
                    >

                {% endif %}


                <div class="card-body">

                    <h4 class="card-title">
                        {{ movie.title }}
                    </h4>

                    <p class="text-muted">
                        {{ movie.year }} • {{ movie.genre }}
                    </p>

                    <p>
                        ⭐ {{ movie.rating }}
                    </p>

                    <p class="card-text">
                        {{ movie.description|truncatewords:20 }}
                    </p>

                    <a
                        href="{% url 'movie_detail' movie.id %}"
                        class="btn btn-primary"
                    >
                        Details
                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="alert alert-warning">
            Film tapılmadı.
        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
