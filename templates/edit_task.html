<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>
</head>

<body>

    <h1>Edit Task</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label>
        <br>
        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >

        <br><br>

        <label>Description:</label>
        <br>
        <textarea
            name="description"
            required
        >{{ task.description }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'task_detail' task.id %}">
        Cancel
    </a>

</body>
</html>
