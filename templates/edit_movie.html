<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Edit Movie</title>

</head>

<body>

<div class="container py-5">

    <h1>✏️ Filmə düzəliş et</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Film adı</label>

            <input
                type="text"
                name="title"
                value="{{ movie.title }}"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label class="form-label">Description</label>

            <textarea
                name="description"
                class="form-control"
                rows="5"
                required
            >{{ movie.description }}</textarea>
        </div>


        <div class="mb-3">
            <label class="form-label">İl</label>

            <input
                type="number"
                name="year"
                value="{{ movie.year }}"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label class="form-label">Janr</label>

            <input
                type="text"
                name="genre"
                value="{{ movie.genre }}"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label class="form-label">Rating</label>

            <input
                type="number"
                name="rating"
                value="{{ movie.rating }}"
                step="0.1"
                min="0"
                max="10"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">

            <label class="form-label">
                Yeni poster
            </label>

            <input
                type="file"
                name="image"
                class="form-control"
            >

        </div>


        <button class="btn btn-warning">
            Save Changes
        </button>

        <a
            href="{% url 'movie_detail' movie.id %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

</body>
</html>
