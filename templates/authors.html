<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Müəlliflər</title>
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">Müəlliflər</h1>

        <a href="{% url 'books' %}" class="btn btn-primary">
            Kitablar
        </a>
    </div>

    <div class="row g-4">

        {% for author in authors %}

        <div class="col-md-6 col-lg-4">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h4 class="card-title">
                        <a href="{% url 'author_detail' author.id %}"
                           class="text-decoration-none">
                            {{ author.name }} {{ author.surname }}
                        </a>
                    </h4>

                    <p class="text-muted mb-3">
                        Doğum tarixi: {{ author.birth_date }}
                    </p>

                    <span class="badge text-bg-primary">
                        {{ author.books.count }} kitab
                    </span>

                    <div class="mt-4">
                        <a href="{% url 'author_detail' author.id %}"
                           class="btn btn-outline-primary">
                            Ətraflı bax
                        </a>
                    </div>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12">
            <div class="alert alert-info">
                Heç bir müəllif yoxdur.
            </div>
        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
