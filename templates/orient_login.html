<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORIENT ACADEMY - Daxil Ol</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #0d6efd, #153b75);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 45px;
            color: #0d6efd;
            margin-bottom: 12px;
        }

        .logo h2 {
            font-size: 24px;
            font-weight: 700;
            color: #153b75;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
            margin: 0;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group-text {
            background: #f5f7fa;
            border-right: none;
            color: #0d6efd;
        }

        .form-control {
            min-height: 46px;
            border-left: none;
            font-size: 14px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }

        .password-toggle {
            cursor: pointer;
            background: #f5f7fa;
            color: #555;
        }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .remember-row a {
            color: #0d6efd;
            text-decoration: none;
        }

        .remember-row a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            min-height: 47px;
            border: none;
            border-radius: 7px;
            background: #0d6efd;
            color: white;
            font-weight: 700;
            font-size: 15px;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #0b5ed7;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 7px;
            background: #f8d7da;
            color: #842029;
            font-size: 13px;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <i class="fas fa-graduation-cap"></i>
        <h2>ORIENT ACADEMY</h2>
        <p>Hesabınıza daxil olun</p>
    </div>

    {% if error %}
        <div class="error-message" role="alert">
            <i class="fas fa-circle-exclamation"></i>
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'orientlogin' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label for="username" class="form-label">
                İstifadəçi adı
            </label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-user"></i>
                </span>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Adınızı daxil edin"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">
                Parol
            </label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                </span>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Parolunuzu daxil edin"
                    autocomplete="current-password"
                    required
                >

                <span class="input-group-text password-toggle"
                      id="togglePassword"
                      title="Parolu göstər">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
        </div>

        <div class="remember-row">
            <label>
                <input type="checkbox" name="remember_me">
                Məni xatırla
            </label>

            <a href="#" onclick="return false;">
                Parolu unutmusunuz?
            </a>
        </div>

        <button type="submit" class="login-btn" id="loginButton">
            <i class="fas fa-right-to-bracket me-2"></i>
            Daxil Ol
        </button>
    </form>

    <div class="footer-text">
        &copy; 2026 ORIENT ACADEMY. Bütün hüquqlar qorunur.
    </div>

</div>

<script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
        const icon = this.querySelector("i");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    });
</script>

</body>
</html>
