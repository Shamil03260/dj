<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <title>Delete Movie</title>

</head>

<body>

<div class="container py-5">

    <div class="card p-4">

        <h2>Filmi silmək istəyirsiniz?</h2>

        <p>
            "{{ movie.title }}" filmini silmək istədiyinizə əminsiniz?
        </p>


        <form method="POST">

            {% csrf_token %}

            <button class="btn btn-danger">
                Yes, Delete
            </button>

            <a
                href="{% url 'movie_detail' movie.id %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

</body>

</html>
