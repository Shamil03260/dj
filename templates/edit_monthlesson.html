
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dərsi redaktə et - ORIENT ACADEMY</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #212529;
        }

        .container-box {
            max-width: 750px;
            margin: 55px auto;
            padding: 35px;
            background-color: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .top h2 {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ced4da;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .btn-save {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-save:hover {
            background-color: #0b5ed7;
            color: white;
        }

        .btn-back {
            display: inline-block;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .btn-back:hover {
            background-color: #565e64;
            color: white;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .container-box {
                margin: 20px 12px;
                padding: 22px;
            }

            .top {
                align-items: flex-start;
                flex-direction: column;
            }

            .top h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container-box">

    <div class="top">
        <h2>
            <i class="fas fa-pen-to-square text-primary"></i>
            Dərsi redaktə et
        </h2>

        <a href="javascript:history.back()" class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Geri qayıt
        </a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="topic" class="form-label">
                Dərsin adı
            </label>

            <input
                type="text"
                id="topic"
                name="topic"
                class="form-control"
                value="{{ lesson.topic }}"
                placeholder="Dərsin adını daxil edin"
                required
            >
        </div>

        <div class="form-group">
            <label for="start_date" class="form-label">
                Başlama tarixi
            </label>

            <input
                type="date"
                id="start_date"
                name="start_date"
                class="form-control"
                value="{{ lesson.start_date|date:'Y-m-d' }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="end_date" class="form-label">
                Bitmə tarixi
            </label>

            <input
                type="date"
                id="end_date"
                name="end_date"
                class="form-control"
                value="{{ lesson.end_date|date:'Y-m-d' }}"
                required
            >
        </div>

        <div class="buttons">
            <a href="javascript:history.back()" class="btn-back">
                Ləğv et
            </a>

            <button type="submit" class="btn-save">
                <i class="fas fa-save"></i>
                Yadda saxla
            </button>
        </div>

    </form>

</div>

</body>
</html>
